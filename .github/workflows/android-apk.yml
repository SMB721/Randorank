# Builds the Android app (mobile/, a Capacitor shell around randorank.com) in the
# cloud so no local Android Studio is needed. Output: a debug APK, signed with the
# automatic debug key, that can be installed on a phone for testing. It is NOT the
# file for the Play Store (that one is a signed release bundle, see mobile/README.md).
#
# Run it by hand: GitHub > Actions > "Android APK" > Run workflow.
# It also runs when files under mobile/ change.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: randorank-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
